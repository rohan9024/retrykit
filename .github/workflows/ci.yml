name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/verify-docs-sync.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
